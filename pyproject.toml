[project]
name = "semsql-to-mongo"
version = "0.1.0"
description = "Load the populated tables of a semsql SQLite ontology build into MongoDB, as-is, with provenance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pymongo>=4.9",
    "click>=8.1",
]

[project.scripts]
semsql-to-mongo = "semsql_to_mongo.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
extend-ignore = ["D203", "D211", "D212"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "S101"]
